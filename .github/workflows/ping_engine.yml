name: SiteLook Automated Ping & Inspection Engine

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  inspect-domains:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper, Pages & Sitemap Generator
        run: |
          python scripts/checker.py
          python scripts/generate_pages.py
          python scripts/generate_sitemap.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/site_status.json status/ sitemap.xml
          git diff --staged --quiet || (git commit -m "auto: update status data, seo pages & sitemap [skip ci]" && git push)